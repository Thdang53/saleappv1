<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Cập Nhật Sản Phẩm</title>
</head>
<body>
<section layout:fragment="content" class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <!-- Back Navigation -->
            <div class="d-flex align-items-center justify-content-between mb-3">
                <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1">
                    <i class="bi bi-arrow-left"></i> Quay lại danh sách
                </a>
            </div>

            <!-- Form Card -->
            <div class="card card-custom border-0 shadow-sm">
                <div class="card-custom-header bg-white">
                    <h4 class="fw-bold text-dark mb-1">Cập Nhật Sản Phẩm</h4>
                    <p class="text-muted small mb-0">Chỉnh sửa thông tin, giá cả và hình ảnh sản phẩm</p>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/products/update/{id}(id=${product.id})}" th:object="${product}" method="post" enctype="multipart/form-data">
                        
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold text-secondary">Tên sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control form-control-lg fs-6" id="name" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label fw-semibold text-secondary">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="number" step="0.01" th:field="*{price}" class="form-control" id="price" required>
                                    <span class="input-group-text bg-light text-muted">VNĐ</span>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label fw-semibold text-secondary">Danh mục <span class="text-danger">*</span></label>
                                <select th:field="*{category}" class="form-select" id="category">
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                            th:selected="${product.category != null and cat.id == product.category.id}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="imageFile" class="form-label fw-semibold text-secondary">Hình ảnh sản phẩm</label>
                            <div class="border rounded-3 p-3 bg-light">
                                <!-- Preview of current image if exists -->
                                <div th:if="${product.image != null and !product.image.isEmpty()}" class="d-flex align-items-center gap-3 mb-3 p-2 bg-white rounded border">
                                    <img th:src="${product.image}" alt="Ảnh hiện tại" class="rounded border" style="width: 70px; height: 70px; object-fit: cover;">
                                    <div>
                                        <div class="fw-medium text-dark small">Ảnh hiện tại đang sử dụng:</div>
                                        <div class="text-muted small text-break" th:text="${product.image}"></div>
                                    </div>
                                </div>

                                <label class="form-label small text-muted mb-1"><i class="bi bi-upload me-1"></i> Tải ảnh mới lên thay thế:</label>
                                <input type="file" name="imageFile" id="imageFile" class="form-control" accept="image/*">
                                
                                <div class="d-flex align-items-center my-2 text-muted small">
                                    <div class="border-top flex-grow-1"></div>
                                    <span class="px-2">hoặc</span>
                                    <div class="border-top flex-grow-1"></div>
                                </div>
                                
                                <label class="form-label small text-muted mb-1"><i class="bi bi-link-45deg me-1"></i> Đường dẫn ảnh:</label>
                                <input type="text" th:field="*{image}" class="form-control form-control-sm" placeholder="Ví dụ: /images/iphone-14.jpg">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold text-secondary">Mô tả sản phẩm <span class="text-danger">*</span></label>
                            <textarea th:field="*{description}" class="form-control" id="description" rows="3" required></textarea>
                        </div>

                        <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                            <a th:href="@{/products}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary px-4 d-inline-flex align-items-center gap-2">
                                <i class="bi bi-save"></i> Lưu Thay Đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
