<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Cập nhật Sản Phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<section layout:fragment="content" class="container mt-5">
    <h1 class="mb-4">Cập nhật Sản Phẩm</h1>
    <form th:action="@{/products/update/{id}(id=${product.id})}" th:object="${product}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="name" class="form-label">Tên sản phẩm:</label>
            <input type="text" th:field="*{name}" class="form-control" id="name" required>
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Giá cả:</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control" id="price" required>
        </div>
        <div class="mb-3">
            <label for="category" class="form-label">Danh mục:</label>
            <select th:field="*{category}" class="form-control" id="category">
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                        th:selected="${product.category != null and cat.id == product.category.id}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="imageFile" class="form-label">Hình ảnh sản phẩm:</label>
            <div th:if="${product.image != null and !product.image.isEmpty()}" class="mb-2">
                <img th:src="${product.image}" alt="Ảnh hiện tại" style="max-width: 120px; max-height: 120px; object-fit: cover;" class="img-thumbnail">
                <div class="small text-muted">Ảnh hiện tại: <span th:text="${product.image}"></span></div>
            </div>
            <input type="file" name="imageFile" id="imageFile" class="form-control" accept="image/*">
            <div class="form-text">Hoặc cập nhật đường dẫn ảnh (tùy chọn):</div>
            <input type="text" th:field="*{image}" class="form-control mt-1" placeholder="Ví dụ: /images/iphone-14.jpg">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Mô tả:</label>
            <textarea th:field="*{description}" class="form-control" id="description" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Lưu Thay Đổi</button>
        <a th:href="@{/products}" class="btn btn-secondary">Hủy</a>
    </form>
</section>
</body>
</html>
