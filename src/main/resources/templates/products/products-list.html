<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Danh Sách Sản Phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<section layout:fragment="content" class="container mt-4">
    <h1 class="mb-3">Danh Sách Sản Phẩm</h1>
    <div class="mb-3">
        <a th:href="@{/products/add}" class="btn btn-primary">Thêm Sản Phẩm Mới</a>
    </div>
    <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Hình Ảnh</th>
                <th>Tên Sản Phẩm</th>
                <th>Giá Cả</th>
                <th>Mô Tả</th>
                <th>Danh Mục</th>
                <th>Hành Động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td>
                    <img th:if="${product.image != null and !product.image.isEmpty()}"
                         th:src="${product.image}"
                         alt="Ảnh sản phẩm"
                         style="max-width: 80px; max-height: 80px; object-fit: cover;"
                         class="img-thumbnail" />
                    <span th:if="${product.image == null or product.image.isEmpty()}"
                          class="text-muted fst-italic">Không có ảnh</span>
                </td>
                <td th:text="${product.name}"></td>
                <td th:text="${product.price}"></td>
                <td th:text="${product.description}"></td>
                <td th:text="${product.category != null ? product.category.name : ''}"></td>
                <td>
                    <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-success btn-sm">Sửa</a>
                    <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa không?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
</section>
</body>
</html>
