<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Hệ Thống Quản Lý</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .custom-navbar {
            background-color: #f5a623;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-custom-orange {
            background-color: #e64a19;
            color: #ffffff;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            padding: 5px 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            border: none;
        }
        .btn-custom-orange:hover {
            background-color: #d84315;
            color: #ffffff;
        }
    </style>
</head>
<body>
<header>
    <div class="custom-navbar">
        <div>
            <a th:href="@{/categories}" class="btn-custom-orange">
                <span style="margin-right: 6px;">&#9881;</span> Quản Lý Sinh Viên
            </a>
        </div>
        <div>
            <a th:href="@{/products}" class="btn-custom-orange">Nhập Sinh Viên</a>
        </div>
    </div>
</header>

<main>
    <div layout:fragment="content"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
