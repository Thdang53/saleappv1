<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Hệ Thống Quản Lý Bán Hàng</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bs-body-font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --bs-body-bg: #f8fafc;
            --bs-body-color: #334155;
            --primary-color: #3b82f6;
            --primary-dark: #1d4ed8;
        }
        body {
            font-family: var(--bs-body-font-family);
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-navbar {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.15);
            padding: 0.85rem 1.5rem;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: #ffffff !important;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .brand-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1rem;
        }
        .nav-link-custom {
            color: #94a3b8 !important;
            font-weight: 500;
            font-size: 0.925rem;
            padding: 0.5rem 0.9rem !important;
            border-radius: 6px;
            transition: all 0.2s ease-in-out;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            text-decoration: none;
        }
        .nav-link-custom:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.08);
        }
        .btn-header-cta {
            background-color: #3b82f6;
            color: #ffffff !important;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
            text-decoration: none;
        }
        .btn-header-cta:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        main {
            flex: 1 0 auto;
        }
        .card-custom {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            overflow: hidden;
        }
        .card-custom-header {
            background-color: #ffffff;
            border-bottom: 1px solid #f1f5f9;
            padding: 1.25rem 1.5rem;
        }
        .table-custom {
            margin-bottom: 0;
        }
        .table-custom thead th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
            font-size: 0.825rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.9rem 1.1rem;
            border-bottom: 1px solid #e2e8f0;
        }
        .table-custom tbody td {
            padding: 1rem 1.1rem;
            vertical-align: middle;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.925rem;
        }
        .table-custom tbody tr:hover {
            background-color: #f8fafc;
        }
        .footer-custom {
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 0.85rem;
            padding: 1.25rem 0;
            text-align: center;
        }
    </style>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg main-navbar">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand" th:href="@{/products}">
                <span class="brand-icon"><i class="bi bi-shop"></i></span>
                <span>SaleApp</span>
            </a>
            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <i class="bi bi-list fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-1">
                    <li class="nav-item">
                        <a th:href="@{/products}" class="nav-link-custom">
                            <i class="bi bi-box-seam"></i> Quản Lý Sản Phẩm
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/categories}" class="nav-link-custom">
                            <i class="bi bi-folder2-open"></i> Quản Lý Danh Mục
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/products/add}" class="btn-header-cta">
                        <i class="bi bi-plus-lg"></i> Thêm Sản Phẩm Mới
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>

<main class="py-4">
    <div layout:fragment="content"></div>
</main>

<footer class="footer-custom mt-auto">
    <div class="container text-center">
        <span>&copy; 2026 <strong>SaleApp</strong> - Hệ Thống Quản Lý Bán Hàng</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
