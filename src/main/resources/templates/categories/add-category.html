<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Thêm Danh Mục Mới</title>
</head>
<body>
<section layout:fragment="content" class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <!-- Navigation -->
            <div class="d-flex align-items-center justify-content-between mb-3">
                <a th:href="@{/categories}" class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1 rounded-pill px-3">
                    <i class="bi bi-arrow-left"></i> Quay lại danh mục
                </a>
            </div>

            <!-- Card Form -->
            <div class="card card-custom border-0 shadow-sm">
                <div class="card-custom-header bg-white">
                    <div class="d-flex align-items-center gap-2">
                        <div class="brand-logo-badge" style="width: 32px; height: 32px; font-size: 0.95rem;">
                            <i class="bi bi-folder-plus"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold text-dark mb-0">Thêm Danh Mục Mới</h4>
                            <p class="text-muted small mb-0">Tạo nhóm phân loại mới cho sản phẩm</p>
                        </div>
                    </div>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/categories/add}" th:object="${category}" method="post">
                        <div class="mb-4">
                            <label for="name" class="form-label fw-semibold text-secondary">
                                Tên danh mục <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-tag"></i></span>
                                <input type="text" id="name" th:field="*{name}" class="form-control form-control-lg fs-6" placeholder="Ví dụ: Điện thoại, Laptop, Đồng hồ..." required />
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                            <a th:href="@{/categories}" class="btn btn-outline-secondary px-4 rounded-pill">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary px-4 rounded-pill fw-semibold d-inline-flex align-items-center gap-2 shadow-sm">
                                <i class="bi bi-check2-circle"></i> Xác Nhận Tạo
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
