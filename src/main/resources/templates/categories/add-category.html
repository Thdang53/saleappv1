<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Thêm Danh Mục Mới</title>
</head>
<body>
<section layout:fragment="content" class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <!-- Navigation -->
            <div class="d-flex align-items-center justify-content-between mb-3">
                <a th:href="@{/categories}" class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1">
                    <i class="bi bi-arrow-left"></i> Quay lại danh sách
                </a>
            </div>

            <!-- Card Form -->
            <div class="card card-custom border-0 shadow-sm">
                <div class="card-custom-header bg-white">
                    <h4 class="fw-bold text-dark mb-1">Thêm Danh Mục Mới</h4>
                    <p class="text-muted small mb-0">Tạo mới nhóm danh mục cho các sản phẩm</p>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/categories/add}" th:object="${category}" method="post">
                        <div class="mb-4">
                            <label for="name" class="form-label fw-semibold text-secondary">Tên danh mục <span class="text-danger">*</span></label>
                            <input type="text" id="name" th:field="*{name}" class="form-control form-control-lg fs-6" placeholder="Ví dụ: Điện thoại, Laptop, Phụ kiện..." required />
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                            <a th:href="@{/categories}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary px-4 d-inline-flex align-items-center gap-2">
                                <i class="bi bi-check2-circle"></i> Xác nhận tạo
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
