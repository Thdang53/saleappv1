<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Danh Sách Danh Mục</title>
</head>
<body>
<section layout:fragment="content" class="container">
    <!-- Header Section -->
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-1">Danh Sách Danh Mục</h2>
            <p class="text-muted small mb-0">Quản lý và phân nhóm các loại sản phẩm</p>
        </div>
        <div>
            <a th:href="@{/categories/add}" class="btn btn-primary d-inline-flex align-items-center gap-2 px-3 py-2 fw-medium shadow-sm">
                <i class="bi bi-plus-circle"></i> Thêm Danh Mục Mới
            </a>
        </div>
    </div>

    <!-- Table Card -->
    <div class="card card-custom border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-custom table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th style="width: 90px;" class="text-center">ID</th>
                        <th>Tên Danh Mục</th>
                        <th style="width: 180px;" class="text-center">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="3" class="text-center py-5 text-muted">
                            <i class="bi bi-folder-x fs-1 d-block mb-2 text-secondary"></i>
                            Chưa có danh mục nào. Hãy bấm "Thêm Danh Mục Mới" để tạo!
                        </td>
                    </tr>
                    <tr th:each="category : ${categories}">
                        <td class="text-center fw-medium text-secondary" th:text="${category.id}">1</td>
                        <td>
                            <div class="fw-semibold text-dark d-flex align-items-center gap-2">
                                <i class="bi bi-tag text-primary"></i>
                                <span th:text="${category.name}">Tên danh mục</span>
                            </div>
                        </td>
                        <td class="text-center">
                            <div class="btn-group" role="group">
                                <a th:href="@{/categories/edit/{id}(id=${category.id})}"
                                   class="btn btn-outline-primary btn-sm d-inline-flex align-items-center gap-1"
                                   title="Chỉnh sửa danh mục">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </a>
                                <a th:href="@{/categories/delete/{id}(id=${category.id})}"
                                   class="btn btn-outline-danger btn-sm d-inline-flex align-items-center gap-1"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?')"
                                   title="Xóa danh mục">
                                    <i class="bi bi-trash3"></i> Xóa
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
